name: Android AAB

on:
  push:
    branches: [ "aab" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - run: chmod +x gradlew
    - name: Build AAB
      run: ./gradlew bundleRelease

    - name: Validate and make test APK
      run: |
        AAB=app/build/outputs/bundle/release/app-release.aab
        curl -sL -o bt.jar https://github.com/google/bundletool/releases/download/1.17.1/bundletool-all-1.17.1.jar
        java -jar bt.jar validate --bundle=$AAB
        keytool -genkeypair -keystore dbg.jks -storepass android -keypass android -alias k -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=test"
        java -jar bt.jar build-apks --bundle=$AAB --output=t.apks --mode=universal --ks=dbg.jks --ks-pass=pass:android --ks-key-alias=k --key-pass=pass:android
        unzip -o t.apks universal.apk

    - uses: actions/upload-artifact@v4
      with:
        name: template-aab
        path: |
          app/build/outputs/bundle/release/app-release.aab
          universal.apk
