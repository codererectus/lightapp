apply plugin: 'com.android.application'

android {
    namespace 'cn.suroy.lightapp'
    compileSdk 35

    lint {
        abortOnError false
    }

    defaultConfig {
        applicationId 'com.pkgplaceholder.xxxxxxxxxxxxxxxxxxxxx'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.drawerlayout:drawerlayout:1.1.1'
}
